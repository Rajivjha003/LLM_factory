[project]
name = "llm-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=2.14.4",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.2",
    "jsonlines>=4.0.0",
    "jsonschema>=4.26.0",
    "langfuse>=4.7.1",
    "llama-index>=0.14.22",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "orjson>=3.11.9",
    "pandas>=2.2,<3",
    "pyarrow<21",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.5",
    "rich>=15.0.0",
    "safetensors>=0.7.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.5.1",
    "sentencepiece>=0.2.1",
    "sqlparse>=0.5.5",
    "tenacity>=9.1.4",
    "tokenizers>=0.22.2",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.0",
    "tqdm>=4.66.5",
    "transformers>=4.57.6",
    "typer>=0.26.7",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
agents = [
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.1",
    "langgraph>=1.2.4",
    "mcp>=1.27.2",
]
pinecone = [
    "pinecone>=9.1.0",
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]
serve = [
    "fastapi>=0.136.3",
    "openai>=2.41.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "prometheus-client>=0.25.0",
    "sse-starlette>=3.4.4",
    "uvicorn>=0.49.0",
]
train = [
    "bitsandbytes>=0.49.2",
    "deepspeed>=0.19.1",
    "einops>=0.8.2",
    "evaluate>=0.4.6",
    "mlflow>=3.5,<4",
    "peft>=0.19.1",
    "trl>=0.10.1",
    "wandb>=0.27.2",
]


[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
